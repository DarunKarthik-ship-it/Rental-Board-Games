revolte:
  version: '1'
  project: 'Rental games'
  appName: 'Rental games app'
  env:
    preview:
      services:
        rid_1:
          name: app
          type: WEB_SERVICE
          entryPoint: src/server.js
          image:
            dockerfile: Dockerfile
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          variables:
            NODE_ENV: production
            PORT: '8080'
            DATABASE_PATH: ./data/rentals.sqlite
            SESSION_SECRET: '#{SESSION_SECRET}'
            TRUST_PROXY: '1'
            PENDING_HOLD_HOURS: '24'
    qa:
      branch: qa
      services:
        rid_1:
          name: app
          type: WEB_SERVICE
          entryPoint: src/server.js
          image:
            dockerfile: Dockerfile
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
          specifications:
            cpu: 2
            memory: 2
            storage: 30
    staging:
      branch: staging
      services:
        rid_1:
          name: app
          type: WEB_SERVICE
          entryPoint: src/server.js
          image:
            dockerfile: Dockerfile
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
          specifications:
            cpu: 2
            memory: 2
            storage: 30
    production:
      branch: main
      services:
        rid_1:
          name: app
          type: WEB_SERVICE
          entryPoint: src/server.js
          image:
            dockerfile: Dockerfile
          properties:
            port: 8080
            health: /health
            loadBalancerMode: dedicated
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
